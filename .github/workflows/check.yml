name: Check for bikes

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only: print messages and don't save the database"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: finder
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The database lives on the "data" branch as a single commit, so main stays clean.
      - name: Load database
        run: |
          if git fetch --depth 1 origin data 2>/dev/null; then
            git show FETCH_HEAD:listings.db > listings.db
          fi

      - name: Check buycycle and Kleinanzeigen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m finder.main ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Show this run
        if: always()
        run: sqlite3 -header listings.db "SELECT * FROM runs ORDER BY rowid DESC LIMIT 4" || true

      - name: Save database
        if: always() && !inputs.dry_run
        run: |
          [ -f listings.db ] || exit 0
          mkdir /tmp/data && cp listings.db /tmp/data/ && cd /tmp/data
          git init -q -b data
          git add listings.db
          git -c user.name="bike-finder" -c user.email="bike-finder@users.noreply.github.com" \
            commit -q -m "Listing database"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data

      # GitHub pauses schedules after 60 days without commits; keep it awake.
      - name: Keep schedule alive
        if: ${{ !inputs.dry_run }}
        run: |
          last=$(git log -1 --format=%ct origin/main 2>/dev/null || git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git -c user.name="bike-finder" -c user.email="bike-finder@users.noreply.github.com" \
              commit -q --allow-empty -m "Keep the schedule running"
            git push -q origin HEAD:main
          fi
