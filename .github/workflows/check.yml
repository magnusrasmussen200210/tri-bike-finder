name: Check for bikes

on:
  schedule:
    - cron: "7 * * * *"   # backup only; runs chain themselves (see below)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only: print messages and don't save the database"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: finder
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The database lives on the "data" branch as a single commit, so main stays clean.
      - name: Load database
        run: |
          if git fetch --depth 1 origin data 2>/dev/null; then
            git show FETCH_HEAD:listings.db > listings.db
          fi

      # GitHub's own 15-minute schedule is unreliable (often hours apart), so each run
      # keeps checking every 15 minutes for almost 6 hours, then starts the next run.
      - name: Check buycycle and Kleinanzeigen every 15 minutes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          end=$(( $(date +%s) + 340 * 60 ))
          while :; do
            started=$(date +%s)
            python -m finder.main ${DRY_RUN:+--dry-run} || echo "check failed, will retry next round"
            sqlite3 listings.db "SELECT started_at, source, status, found, new FROM runs ORDER BY rowid DESC LIMIT 2" || true
            [ -n "$DRY_RUN" ] && break
            deploy/save_db.sh || echo "saving the database failed"
            next=$(( started + 15 * 60 ))
            [ "$next" -ge "$end" ] && break
            sleep $(( next - $(date +%s) > 0 ? next - $(date +%s) : 0 ))
          done

      - name: Show listing sample
        if: always()
        run: |
          sqlite3 listings.db "SELECT source, brakes, COUNT(*) FROM listings GROUP BY 1,2" || true
          sqlite3 listings.db "SELECT source, price, brakes, is_frameset, title FROM listings WHERE alerted=1 ORDER BY first_seen DESC LIMIT 15" || true

      - name: Start the next run
        if: ${{ !inputs.dry_run && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check.yml --ref main

      # GitHub pauses schedules after 60 days without commits; keep it awake.
      - name: Keep schedule alive
        if: ${{ !inputs.dry_run }}
        run: |
          last=$(git log -1 --format=%ct origin/main 2>/dev/null || git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git -c user.name="bike-finder" -c user.email="bike-finder@users.noreply.github.com" \
              commit -q --allow-empty -m "Keep the schedule running"
            git push -q origin HEAD:main
          fi
