name: Export Kleinanzeigen listings

on:
  push:
    branches: [claude/project-thread-eajggt]
    paths: [finder/export.py, .github/workflows/export.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m finder.export 1000 4000 export.json
      # Raw results go on their own branch so code branches stay clean.
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan export
          git rm -rq --cached .
          git add -f export.json
          git commit -qm "Kleinanzeigen export $(date -u +%F)"
          git push -f origin export
