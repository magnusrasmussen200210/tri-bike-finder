name: Debug site pages

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated URLs (blank = defaults)"
        required: false

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m finder.debug ${{ inputs.urls }}
